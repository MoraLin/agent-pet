<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Agent Pet</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 20px 24px;
    background: #fff;
    color: #222;
    font-size: 14px;
    line-height: 1.6;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .hl {
    color: #d0342c;
    font-weight: 700;
  }
  .row {
    text-align: right;
    margin-top: 16px;
  }
  button {
    padding: 6px 18px;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
  }
  button:hover {
    background: #eee;
  }
</style>
</head>
<body>
  <h1>Codex hook settings updated / Codex hook 設定已更新</h1>
  <p>
    Codex requires you to re-approve a hook whenever its command changes.
    Open Codex and run <span class="hl">/hooks</span>, then press
    <span class="hl">t</span> to trust it - otherwise the pet won't react to
    Codex events.
  </p>
  <p>
    每次 hook 指令內容有變動，Codex 都需要重新審核。請到 Codex 執行
    <span class="hl">/hooks</span>，按 <span class="hl">t</span>
    全部信任，寵物才能繼續接收 Codex 事件。
  </p>
  <div class="row"><button onclick="window.close()">OK / 知道了</button></div>
</body>
</html>
