name: Release

# Only real version tags (e.g. v1.2.0) trigger a publish to the Downloads
# repo. workflow_dispatch exists purely so a human can run the build/lint
# jobs manually to sanity-check a branch - it never runs the release job.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  DOWNLOADS_REPO: MoraLin/AgentPet-Downloads

jobs:
  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag to package.json version
        id: check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # A prerelease tag (e.g. "1.2.0-rc.1") is tested against the base
          # version before the first "-" - package.json stays at the plain
          # target version ("1.2.0") for both the RC and the real release.
          BASE_VERSION="${TAG_VERSION%%-*}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (base version $BASE_VERSION) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$BASE_VERSION" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Verified: tag ${GITHUB_REF_NAME} is a prerelease of package.json version ${PKG_VERSION}"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Verified: tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION}"
          fi

  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test

  build-macos:
    name: Build macOS (arm64 + x64)
    needs: [verify-version, lint-and-test]
    runs-on: macos-latest
    env:
      # No signing identity exists on the CI runner - without this,
      # electron-builder tries to auto-discover one and fails the build.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dist
      - run: pnpm run dist:x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/Agent-Pet-arm64.dmg
            dist/Agent-Pet-x64.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: [verify-version, lint-and-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/Agent-Pet-win.exe
          if-no-files-found: error

  release:
    name: Publish release to AgentPet-Downloads
    needs: [verify-version, lint-and-test, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist

      - name: Verify DOWNLOADS_REPO_TOKEN is configured
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DOWNLOADS_REPO_TOKEN is not configured"
            exit 1
          fi

      - name: Fail if a release for this tag already exists
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${DOWNLOADS_REPO}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists on ${DOWNLOADS_REPO} - refusing to overwrite. Delete it manually first if this is intentional."
            exit 1
          fi

      - name: Create GitHub Release on Downloads repo
        run: |
          PRERELEASE_FLAG=()
          if [ "${{ needs.verify-version.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${DOWNLOADS_REPO}" \
            --title "Agent Pet ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "${PRERELEASE_FLAG[@]}" \
            dist/Agent-Pet-arm64.dmg \
            dist/Agent-Pet-x64.dmg \
            dist/Agent-Pet-win.exe

  sync-website-version:
    name: Sync stable version to agent-pet-site
    needs: [verify-version, release]
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/') &&
        needs.verify-version.outputs.is_prerelease == 'false' &&
        needs.release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEBSITE_TOKEN: ${{ secrets.AGENT_PET_SITE_TOKEN }}
    steps:
      - name: Verify AGENT_PET_SITE_TOKEN is configured
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "::error::AGENT_PET_SITE_TOKEN is not configured"
            exit 1
          fi

      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: MoraLin/agent-pet-site
          ref: main
          token: ${{ secrets.AGENT_PET_SITE_TOKEN }}
          path: agent-pet-site
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare and sync website version
        id: sync
        working-directory: agent-pet-site
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          WEBSITE_VERSION=$(node -p "require('./package.json').version")

          node -e '
            const [website, release] = process.argv.slice(1);
            const parse = (value) => {
              if (!/^(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)$/.test(value)) {
                console.error(`Invalid stable semver: ${value}`);
                process.exit(2);
              }
              return value.split(".").map(Number);
            };
            const left = parse(website);
            const right = parse(release);
            const comparison = left.findIndex((part, index) => part !== right[index]);
            if (comparison >= 0 && left[comparison] > right[comparison]) process.exit(1);
          ' "$WEBSITE_VERSION" "$RELEASE_VERSION" || {
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "::error::Version regression refused: website v${WEBSITE_VERSION} is newer than release v${RELEASE_VERSION}"
            fi
            exit "$status"
          }

          if [ "$WEBSITE_VERSION" = "$RELEASE_VERSION" ]; then
            echo "Website is already at v${RELEASE_VERSION}; no commit required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify version-only diff
        if: steps.sync.outputs.changed == 'true'
        working-directory: agent-pet-site
        run: |
          CHANGED_FILES=$(git diff --name-only)
          UNEXPECTED_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep -Ev '^(package.json|package-lock.json)$' || true)
          if [ -n "$UNEXPECTED_FILES" ]; then
            echo "::error::npm version changed unexpected files:"
            printf '%s\n' "$UNEXPECTED_FILES"
            exit 1
          fi
          git diff --check
          git diff --exit-code -- package-lock.json package.json >/dev/null && {
            echo "::error::Expected a version diff but none was produced"
            exit 1
          }
          git diff -- package.json package-lock.json

      - name: Commit and push website version
        if: steps.sync.outputs.changed == 'true'
        working-directory: agent-pet-site
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): sync Agent Pet ${RELEASE_VERSION}"
          git push origin HEAD:main
